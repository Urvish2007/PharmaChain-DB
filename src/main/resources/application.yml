server:
  port: 8080

spring:
  application:
    name: pharmachain-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:pharmachain}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    # DDL already lives in schema_and_data.sql (tables, seed data, triggers, views, procedure) -
    # Hibernate must NEVER generate, alter, or validate the schema; the SQL scripts are the
    # single source of truth. Correctness of the entity <-> table mapping is covered by the
    # Testcontainers integration tests instead.
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        default_schema: pharma_manufacturing
        format_sql: true
    show-sql: false

  # Spring AI: Anthropic for chat, Ollama for embeddings only. Nested under this SAME `spring:`
  # key (not a second top-level `spring:` block - a duplicate top-level key is invalid YAML and
  # SnakeYAML throws DuplicateKeyException on it, which previously prevented Spring Boot from
  # starting at all, in dev, in tests, and in a container alike).
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-4-5
          temperature: 0.3
    # Ollama is used ONLY for embeddings here (see AiConfig - the chat client is wired
    # explicitly to AnthropicChatModel, so having both providers on the classpath is fine).
    # Run `ollama pull nomic-embed-text` locally before using any /api/v1/ai/** endpoint.
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        table-name: compliance_docs
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768 # must match nomic-embed-text's output size
        initialize-schema: true
        # Deliberately left in the default "public" schema, not pharma_manufacturing: this
        # table is a Spring-AI-managed concern, not part of the hand-designed business schema,
        # and initializing it must not depend on db/01_schema_and_data.sql having run first.

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

app:
  jwt:
    # 256-bit (32+ byte) HMAC-SHA256 signing key. This default is fine for local development
    # only - override with the JWT_SECRET env var (a long random string) for anything else.
    secret: ${JWT_SECRET:this-is-a-local-development-only-secret-change-it-before-deploying}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000} # 1 hour
  ai:
    # Matches ComplianceDocsIngestionRunner's @ConditionalOnProperty (defaults to true when
    # absent). Exposed here as a named env var so a container can disable it without Ollama.
    ingest-compliance-docs-on-startup: ${INGEST_COMPLIANCE_DOCS:true}

logging:
  level:
    com.pharmachain: INFO
    org.hibernate.SQL: WARN
